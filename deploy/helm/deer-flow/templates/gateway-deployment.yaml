apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synapse-ai.fullname" . }}-gateway
  namespace: {{ include "synapse-ai.namespace" . }}
  labels:
    {{- include "synapse-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "synapse-ai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "synapse-ai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
      annotations:
        # Roll pods when the mounted ConfigMaps change (subPath mounts don't
        # get live updates, so without this a config-only upgrade is ignored).
        checksum/config: {{ include "synapse-ai.configChecksum" . }}
        checksum/extensions: {{ include "synapse-ai.extensionsChecksum" . }}
    spec:
      {{- include "synapse-ai.imagePullSecrets" . | nindent 6 }}
      # MUST exceed channel stop (~5s) + memory shutdown_flush_timeout_seconds
      # (default 30s) + buffer, or K8s SIGKILLs the memory drain mid-flight
      # (values.yaml gateway.terminationGracePeriodSeconds). K8s defaults to 30s.
      terminationGracePeriodSeconds: {{ .Values.gateway.terminationGracePeriodSeconds | default 45 }}
      securityContext:
        # Non-root: the gateway image has no USER directive and would otherwise
        # run as root. uid/gid 1000; fsGroup 1000 so the .synapse-ai PVC is
        # group-writable for memory/sqlite/custom-agent state.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # initContainer ensures the subPath `synapse-ai/` exists on the PV so the
      # volumeMount succeeds on first boot, and the PVC layout matches what the
      # provisioner's PVC user-data mode expects (synapse-ai/users/.../user-data).
      {{- if .Values.persistence.home.enabled }}
      initContainers:
        - name: init-home
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /home-pvc/synapse-ai/data"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: home
              mountPath: /home-pvc
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "synapse-ai.gatewayImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          workingDir: /app
          command: ["sh", "-c"]
          args:
            - cd backend && PYTHONPATH=. uv run --no-sync uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --workers 1
          env:
            - name: CI
              value: "true"
            # Running as non-root uid 1000: suppress .pyc writes under the
            # root-owned /app (avoids PermissionError noise; harmless fallback).
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            # uv would cache to ~/.cache (no home dir as 1000); point it at /tmp
            # (1777). --no-sync means no install/cache writes in practice.
            - name: UV_CACHE_DIR
              value: /tmp
            - name: SYNAPSE_PROJECT_ROOT
              value: /app
            - name: SYNAPSE_HOME
              value: /app/backend/.synapse-ai
            - name: SYNAPSE_CONFIG_PATH
              value: /app/backend/config.yaml
            - name: SYNAPSE_EXTENSIONS_CONFIG_PATH
              value: /app/backend/extensions_config.json
            - name: SYNAPSE_CHANNELS_LANGGRAPH_URL
              value: http://gateway:8001/api
            - name: SYNAPSE_CHANNELS_GATEWAY_URL
              value: http://gateway:8001
            - name: SYNAPSE_HOST_BASE_DIR
              value: /app/backend/.synapse-ai
            - name: GATEWAY_HOST
              value: 0.0.0.0
            - name: GATEWAY_PORT
              value: "8001"
            - name: SYNAPSE_INTERNAL_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "synapse-ai.appSecret" . }}
                  key: SYNAPSE_INTERNAL_AUTH_TOKEN
            {{- /* PostgreSQL DSN — only mounted when postgres is configured
                  (bundled StatefulSet, external databaseUrl, or an existing
                  Secret). In sqlite/memory mode the env is omitted and
                  config.yaml's database.postgres_url is never read. */ -}}
            {{- $pgConfigured := or .Values.postgresql.enabled .Values.postgresql.external.databaseUrl .Values.postgresql.external.existingSecret .Values.postgresql.existingSecret -}}
            {{- if $pgConfigured }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "synapse-ai.databaseUrlSecret" . }}
                  key: database-url
            {{- end }}
            {{- /* Redis stream-bridge URL — only mounted when redis is configured
                  (bundled StatefulSet, external URL, or an existing Secret).
                  Drives cross-pod SSE delivery (PR #3191). redis-py connects via
                  raw TCP so HTTP_PROXY/NO_PROXY do not apply. */ -}}
            {{- if (include "synapse-ai.redisConfigured" .) }}
            - name: SYNAPSE_STREAM_BRIDGE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "synapse-ai.redisUrlSecret" . }}
                  key: redis-url
            {{- end }}
            - name: NO_PROXY
              value: localhost,127.0.0.1,::1,gateway,frontend,nginx,provisioner
            - name: no_proxy
              value: localhost,127.0.0.1,::1,gateway,frontend,nginx,provisioner
          {{- if or .Values.secrets .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ include "synapse-ai.providerSecret" . }}
          {{- end }}
          ports:
            - containerPort: 8001
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          {{- /* preStop sleep so the Service/ingress deregisters the pod and
                  in-flight requests drain before SIGTERM begins graceful shutdown
                  (which runs the memory queue drain). 0 / unset disables it.
                  Counts against terminationGracePeriodSeconds. */ -}}
          {{- if and .Values.gateway.preStopSleepSeconds (gt (.Values.gateway.preStopSleepSeconds | int) 0) }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.gateway.preStopSleepSeconds | int }}"]
          {{- end }}
          {{- with .Values.gateway.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/backend/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: extensions
              mountPath: /app/backend/extensions_config.json
              subPath: extensions_config.json
              readOnly: true
            - name: skills
              mountPath: /app/skills
              readOnly: true
            {{- if .Values.persistence.home.enabled }}
            - name: home
              mountPath: /app/backend/.synapse-ai
              subPath: synapse-ai
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "synapse-ai.fullname" . }}-config
        - name: extensions
          configMap:
            name: {{ include "synapse-ai.fullname" . }}-extensions
        - name: skills
          {{- if .Values.skills.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.skills.existingClaim }}
          {{- else if .Values.skills.configMap }}
          configMap:
            name: {{ .Values.skills.configMap }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.persistence.home.enabled }}
        - name: home
          persistentVolumeClaim:
            claimName: {{ include "synapse-ai.homePVC" . }}
        {{- end }}
