[project]
name = "synapse-harness"
version = "1.0.0"
description = "SynapseAI agent harness framework"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "MauryaQbit", email = "dhananjaymaury366@gmail.com"}
]
dependencies = [
    "agent-sandbox>=0.0.30",
    "croniter>=6.0.0",
    "synapse-extension-api==1.0.0",
    "dotenv>=0.9.9",
    "httpx>=0.28.0",
    "langchain>=1.3",
    "langchain-anthropic>=1.4.1",
    "langchain-openai>=1.2.1",
    "langfuse>=3.4.1",
    "langgraph>=1.2.9,<1.3",
    "langgraph-api>=0.8.1",
    "langgraph-cli>=0.4.24",
    "langgraph-runtime-inmem>=0.30.0",
    "markdownify>=1.2.2",
    "markitdown[all,xlsx]>=0.0.1a2",
    "packaging>=24.2",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "tiktoken>=0.8.0",
    "ddgs>=9.10.0",
    "langchain-google-genai>=4.2.1",
    "langgraph-checkpoint-sqlite>=3.1.1,<3.2",
    "langgraph-sdk>=0.1.51",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.19",
    "alembic>=1.13",
    "cryptography>=50.0.0",
]

[project.scripts]
synapse = "synapse.tui.cli:main"

[project.optional-dependencies]
tui = ["textual>=0.80"]
ollama = ["langchain-ollama>=0.3.0"]
postgres = [
    "asyncpg>=0.29",
    "langgraph-checkpoint-postgres>=3.1.1,<3.2",
    "psycopg[binary]>=3.3.3",
    "psycopg-pool>=3.3.0",
]
redis = ["redis>=5.0.0"]
browser = ["playwright>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synapse"]
