[project]
name = "synapse-ai"
version = "1.0.0"
description = "Intelligent Agent Orchestration Platform with sandbox execution"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "MauryaQbit", email = "dhananjaymaury366@gmail.com"}
]
keywords = ["ai", "agents", "orchestration", "langgraph", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "synapse-harness",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.31",
    "sse-starlette>=2.1.0",
    "starlette>=1.3.1,<2",
    "uvicorn[standard]>=0.34.0",
    "langgraph-sdk>=0.1.51",
    "bcrypt>=4.0.0",
    "pyjwt>=2.13.0",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
postgres = ["synapse-harness[postgres]"]
redis = ["synapse-harness[redis]"]
browser = ["synapse-harness[browser]"]
all = [
    "synapse-ai[postgres]",
    "synapse-ai[redis]",
    "synapse-ai[browser]",
]

[dependency-groups]
extensions = []
dev = [
    "blockbuster>=1.5.26,<1.6",
    "hypothesis>=6.100,<7",
    "jsonschema>=4.26.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.11",
    "redis>=5.0.0",
]

[tool.pytest.ini_options]
markers = [
    "no_auto_user: disable the conftest autouse contextvar fixture for this test",
    "allow_blocking_io: opt out of the strict Blockbuster gate in tests/blocking_io/",
    "integration: tests that require an external service (e.g. Redis); skipped when unavailable",
    "live: tests that call real external APIs and require explicit opt-in",
]

[tool.uv]
index-url = "https://pypi.org/simple"
default-groups = ["dev", "extensions"]

[tool.uv.workspace]
members = ["packages/harness", "packages/extension-api"]

[tool.uv.sources]
synapse-harness = {workspace = true}
synapse-extension-api = {workspace = true}

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
