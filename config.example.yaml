# SynapseAI Configuration Template
# Copy this file to config.yaml and customize

app:
  name: "SynapseAI"
  version: "1.0.0"
  description: "Intelligent Agent Orchestration Platform"

# LLM Models
models:
  - name: "gpt-4"
    provider: "openai"
    api_key: "${OPENAI_API_KEY}"
    max_tokens: 4096
    supports_thinking: true
    supports_vision: true
  
  - name: "claude-3-sonnet"
    provider: "anthropic"
    api_key: "${ANTHROPIC_API_KEY}"
    max_tokens: 4096

# Default model for conversations
default_model: "gpt-4"

# Tools configuration
tools:
  enabled:
    - "web_search"
    - "code_execution"
    - "file_operations"
    - "ask_clarification"
  
  web_search:
    provider: "duckduckgo"
  
  code_execution:
    enabled: true
    timeout: 60

# Memory configuration
memory:
  enabled: true
  backend: "sqlite"
  max_tokens: 10000
  
  summarization:
    enabled: true
    trigger_tokens: 8000
    keep_recent: 5

# Sandbox configuration
sandbox:
  enabled: true
  type: "local"
  
  docker:
    image: "python:3.12-slim"
    timeout: 300

# Goal tracking
goals:
  enabled: true
  max_continuations: 5

# Skills
skills:
  enabled: true
  auto_discover: true
  
  builtins:
    - "deep-research"
    - "code-analysis"
    - "document-processing"

# Server configuration
server:
  host: "127.0.0.1"
  port: 8001
  
  cors:
    enabled: true
    origins:
      - "http://localhost:3000"
      - "http://localhost:2026"

# Frontend configuration
frontend:
  port: 3000
  
  features:
    voice_input: true
    dark_mode: true
    streaming: true

# Logging
logging:
  level: "INFO"
  format: "json"

# Security
security:
  session_timeout: 24
  
  rate_limit:
    enabled: true
    requests_per_minute: 60
